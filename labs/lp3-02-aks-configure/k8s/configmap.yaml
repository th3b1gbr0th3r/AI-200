apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config          # el Deployment lo busca con configMapRef: api-config
  labels:
    app: aks-config-api # Label for the AKS configuration API
data:
  # Store non-sensitive configuration values
  STUDENT_NAME: "YourNameHere"
  API_VERSION: "1.0.0"
  LOG_PATH: "/var/log/api" # Path for API logs (mount point of the PVC)
