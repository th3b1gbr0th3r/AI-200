apiVersion: v1
kind: Secret
metadata:
  name: api-secrets         # el Deployment lo busca con secretKeyRef: api-secrets
  labels:
    app: aks-config-api
type: Opaque
stringData:
  # Valores de PRUEBA (ficticios). Kubernetes los guarda en base64.
  secret-endpoint: "SecretEndpointValue"
  secret-access-key: "SecretAccessKey123456"
